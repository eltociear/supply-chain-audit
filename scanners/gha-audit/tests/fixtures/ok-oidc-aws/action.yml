name: Assume role
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
        curl -sS -X POST "https://sts.amazonaws.com/?Action=AssumeRoleWithWebIdentity" -d "WebIdentityToken=$TOKEN"
        curl -sS -X POST "$VAULT_ADDR/v1/auth/jwt/login" -d "{\"jwt\":\"$TOKEN\"}"
